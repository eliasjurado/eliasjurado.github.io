# Diccionario i18n del sitio Elías Jurado.
#
# Uso desde HTML/Markdown:
#   <span data-i18n="nav.home">Inicio</span>
# El texto que escribas dentro del span es el fallback (ES por defecto).
# El JS lee el diccionario al cargar y reemplaza si idioma activo = EN.
#
# Detección de idioma:
#   1) localStorage.eliasjurado_lang (preferencia explícita del usuario)
#   2) navigator.language: si empieza con "es" → ES, en cualquier otro caso → EN
#   3) fallback final: ES
#
# Estructura: claves jerárquicas con .es / .en obligatorios.
# Mantener orden alfabético dentro de cada grupo para facilitar mantenimiento.

# ── NAVEGACIÓN ─────────────────────────────────────────────────────────────
nav:
  home:        { es: "Inicio",      en: "Home"        }
  strategies:  { es: "Estrategias", en: "Strategies"  }
  portfolio:   { es: "Portafolio",  en: "Portfolio"   }
  about:       { es: "Sobre mí",    en: "About"       }
  contact:     { es: "Contacto",    en: "Contact"     }

